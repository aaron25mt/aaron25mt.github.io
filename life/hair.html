<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Hair — Aaron's Life Guide</title>
  <style>
    :root { color-scheme: dark; --ink:#f5efe6; --muted:#b9afa2; --accent:#d5a766; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 15% 15%,#31291f 0,transparent 42%),#12110f; color:var(--ink); font:16px/1.6 Inter,ui-sans-serif,system-ui,sans-serif; }
    main { width:min(680px,100%); padding:clamp(28px,7vw,72px); border:1px solid #ffffff1f; border-radius:28px; background:#ffffff08; box-shadow:0 24px 90px #0008; }
    nav { display:flex; gap:18px; flex-wrap:wrap; }
    a { color:var(--ink); text-underline-offset:5px; }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:5px; border-radius:3px; }
    p.eyebrow { margin-top:72px; color:var(--accent); text-transform:uppercase; letter-spacing:.16em; font-size:.74rem; font-weight:750; }
    h1 { margin:.2em 0; font:clamp(3rem,12vw,6.5rem)/.9 Georgia,serif; letter-spacing:-.055em; }
    p.copy { max-width:42ch; color:var(--muted); font-size:clamp(1rem,2.4vw,1.2rem); }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Breadcrumbs"><a href="./">← Life</a><a href="../">Aaron's site</a></nav>
    <p class="eyebrow">Guide in development</p>
    <h1>Hair</h1>
    <p class="copy">Care, cuts, styling, and a routine that works will live here.</p>
  </main>
</body>
</html>
